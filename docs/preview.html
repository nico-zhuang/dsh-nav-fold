<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dsh-nav-fold 匿名演示｜全部名称均为虚拟数据</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #17191f; color: #f5f5f7; font: 15px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  .canvas { width: 920px; height: 570px; display: flex; gap: 25px; padding: 25px; background: radial-gradient(circle at 85% 15%, #262b38, #16181f 60%); }
  .sidebar { width: 350px; padding: 23px 22px; border: 1px solid #494d58; border-radius: 16px; background: linear-gradient(#32343d,#282a32); flex: none; box-shadow: 0 20px 40px #0005; }
  .window { display: flex; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #ff6464; }
  .dot:nth-child(2) { background: #ffcd39; } .dot:nth-child(3) { background: #35d66f; }
  .brand { margin: 29px 0 28px; font-size: 23px; font-weight: 750; letter-spacing: -.6px; }
  .brand small { margin-left: 6px; padding: 2px 6px; border: 1px solid #ddd; border-radius: 3px; font-size: 10px; vertical-align: middle; letter-spacing: 0; }
  .new { width: 100%; padding: 12px 0; text-align: center; border: 1px solid #7779; border-radius: 9px; background: #ffffff1d; font-size: 18px; }
  nav.x_panelList { display: flex; flex-direction: column; gap: 4px; margin-top: 16px; }
  button.x_panelRow { display: flex; align-items: center; gap: 10px; min-height: 36px; border: 0; border-radius: 6px; background: transparent; color: inherit; text-align: left; cursor: pointer; padding: 5px 8px; font: inherit; }
  button.x_panelRow:hover { background: #ffffff18; }
  .x_panelGlyph { width: 20px; font-size: 22px; line-height: 1; text-align: center; flex: none; }
  .x_panelTitle { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .workspaces { border-top: 1px solid #ffffff2b; margin-top: 20px; padding-top: 15px; color: #b9bbc3; }
  .workspaces div { padding: 10px; color: #e8e8ed; }
  .notes { flex: 1; padding: 36px 15px 15px; }
  .eyebrow { font-size: 13px; letter-spacing: 2px; color: #91bfff; }
  h1 { font-size: 30px; margin: 16px 0 22px; line-height: 1.35; }
  .notes p { color: #c8cbd6; line-height: 1.9; font-size: 16px; }
  .note { margin-top: 70px; padding: 14px; border: 1px solid #ffffff26; border-radius: 8px; font-size: 12px; color: #b5b7c3; }
</style>
<div class="canvas">
  <div class="sidebar">
    <div class="window"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
    <div class="brand">deepseek <small>HARNESS</small></div>
    <div class="new">⊕ &nbsp;新会话</div>
    <nav class="x_panelList" aria-label="全局面板">
      <button class="x_panelRow" aria-label="插件"><span class="x_panelGlyph">✧</span><span class="x_panelTitle">插件</span></button>
      <button class="x_panelRow" aria-label="插件市场"><span class="x_panelGlyph">▦</span><span class="x_panelTitle">插件市场</span></button>
      <button class="x_panelRow" aria-label="自动化任务"><span class="x_panelGlyph">◷</span><span class="x_panelTitle">自动化任务</span></button>
      <button class="x_panelRow" aria-label="任务看板"><span class="x_panelGlyph">▣</span><span class="x_panelTitle">任务看板</span></button>
      <button class="x_panelRow" aria-label="技能中心"><span class="x_panelGlyph">◇</span><span class="x_panelTitle">技能中心</span></button>
      <button class="x_panelRow" aria-label="记忆系统"><span class="x_panelGlyph">✿</span><span class="x_panelTitle">记忆系统</span></button>
      <button class="x_panelRow" aria-label="示例面板 A"><span class="x_panelGlyph">◈</span><span class="x_panelTitle">示例面板 A</span></button>
      <button class="x_panelRow" aria-label="示例面板 B"><span class="x_panelGlyph">✦</span><span class="x_panelTitle">示例面板 B</span></button>
    </nav>
    <div class="workspaces">工作区<div>▱ &nbsp;示例项目 A</div><div>▱ &nbsp;示例项目 B</div></div>
  </div>
  <div class="notes"><div class="eyebrow">DSH NAV FOLD · 0.3.0</div><h1 id="headline"></h1><p id="details"></p><div class="note">匿名示意：画面由虚拟项目和虚拟面板名称生成，不含真实用户会话、路径或账号。</div></div>
</div>
<script>window.__ModuleLoader__ = { load: bundle => window.navBundle = bundle };</script>
<script src="../lib/client.js"></script>
<script>
  navBundle.factory().apply({ effect: fn => fn() });
  const mode = new URL(location.href).searchParams.get('mode');
  const nav = document.querySelector('nav');
  const headline = document.querySelector('#headline');
  const details = document.querySelector('#details');
  if (mode === 'expanded') {
    document.querySelector('.canvas').style.height = '760px';
    nav.querySelector('[data-sidebar-nav-toggle]').click();
    headline.textContent = '一条线，展开原来的列表';
    details.textContent = '细线顺着图标布局向下移动；工作区、会话入口保持独立。';
  } else if (mode === 'drag') {
    const row = nav.querySelector('[aria-label="任务看板"]');
    row.dataset.sidebarDrop = 'before';
    nav.querySelector('[aria-label="插件"]:not([data-sidebar-nav-toggle])').dataset.sidebarDragging = '';
    headline.textContent = '拖动排序，松手吸附';
    details.textContent = '蓝色高光提示落点；悬停图标可查看当前语言的名称；顺序保存在本机。';
  } else {
    headline.textContent = '侧栏再窄，图标也能换行';
    details.textContent = '无横向滚动条。底部细线随图标平滑重排而上移，鼠标和键盘都能操作。';
  }
</script>
</html>
